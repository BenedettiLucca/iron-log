name: Quality

on:
  push:
    branches:
      - master
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Audit, typecheck, lint, test, and Android export
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version-file: .node-version
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Security audit
        run: npm run audit:high

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint -- --max-warnings=0

      - name: Clear jest transform cache
        # #143 — stale transform cache between CI runs made session-lifecycle
        # fault-injection flip-flop (state persisted in /tmp jest cache).
        run: npx jest --clearCache

      - name: Test and coverage (app suites)
        # #143 — session-lifecycle fault-injection is order-sensitive when run
        # in the same jest process as React Testing Library suites (RTL act()
        # leaves timers that interleave with synchronous better-sqlite3
        # transactions). Run it in its own pass, everything else together.
        run: npm run test:coverage -- --watchAll=false --testPathIgnorePatterns '/node_modules/' 'services/session-lifecycle'

      - name: Test and coverage (session lifecycle)
        # no --coverage here: global thresholds are enforced by the app-suites
        # step; this isolated pass only proves the fault-injection behavior.
        run: npx jest __tests__/services/session-lifecycle.test.ts --runInBand --watchAll=false

      - name: Export Android bundle
        run: npm run export:android

      - name: Verify Android bundle
        run: npm run verify:android-export
